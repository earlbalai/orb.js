<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb - Agent roster</title>

<!--
  Orb by Earl Balai. Agent roster example.

  Many orbs at once, one per agent id.

  The seed is a permanent identity. Palette, archetype, structural phase,
  starting spin, even the clock offset that stops two orbs marching in lockstep,
  all come out of a 32-bit FNV-1a hash of the seed string. Nothing is random and
  nothing is stored. identityForSeed(seed) is pure, so the same agent id gives
  the same orb on every device, a different id gives a visibly different one,
  and you never persist a colour, a theme or an avatar file. Rebuild all
  destroys every orb and mounts a fresh set from the same ids; they come back
  identical.

  A list of orbs is also cheap. Small orbs ride an instanced batch path: one GL
  draw call renders the whole roster into a shared atlas and each orb blits its
  tile. An orb qualifies when it has no chromatic lens and its backing store is
  128 device pixels or less, which is why every orb here is mounted with:

      size: 64,      // 64 CSS px, so at most 128 device px at dpr 2
      lens: false    // the rim lens forces the per-orb hero path

  The stats bar shows diagnostics().batched, how many live orbs are on that
  path, and diagnostics().drawCalls per frame. Add fifty agents and the draw
  calls stay flat. The toggle calls setBatching(false) if you want to measure
  the difference.

  Audio: agents talking at once share ONE OrbAudioSource. The library ticks a
  source once per frame no matter how many orbs subscribe, so ten speaking orbs
  cost one analyser read.

  Ownership matters. We call source.start() ourselves, so the source is ours,
  and an orb that binds an already-started source leaves it running when it
  unbinds. Had the first orb started it, the first orb to unbind would have
  pulled it out from under the others.
-->

<style>
  :root { --bg:#07080c; --panel:#11131a; --line:#232733; --fg:#e8ebf2;
          --dim:#8b93a7; --accent:#7dd3fc; --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font:14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         padding:28px 20px 48px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .sub { margin:0 0 22px; color:var(--dim); font-size:13px; }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
         padding:14px; background:var(--panel); border:1px solid var(--line);
         border-radius:14px; margin-bottom:14px; }
  button { font:inherit; font-size:13px; font-weight:550; padding:7px 14px; border-radius:999px;
           border:1px solid var(--line); background:#1b1f29; color:var(--fg); cursor:pointer; }
  button:hover { border-color:#39414f; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06121a; }
  button.on { background:#2a3140; border-color:#4a5568; }
  .spacer { flex:1; }

  .stats { display:flex; gap:16px; flex-wrap:wrap; padding:11px 14px; margin-bottom:20px;
           background:var(--panel); border:1px solid var(--line); border-radius:14px;
           font:11px/1.5 var(--mono); color:var(--dim); }
  .stats b { color:var(--fg); font-weight:600; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
  .agent { display:flex; flex-direction:column; align-items:center; gap:7px;
           padding:14px 8px 12px; border-radius:14px; border:1px solid transparent;
           background:#0d1016; cursor:pointer; transition:border-color 120ms, background 120ms; }
  .agent:hover { border-color:var(--line); background:#101420; }
  .agent .slot { width:64px; height:64px; }
  .agent .id { font:11px/1.3 var(--mono); color:var(--fg); text-align:center;
               max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .agent .meta { font:9.5px/1.3 var(--mono); color:var(--dim); text-align:center; }
  .agent .st { font:9.5px/1 var(--mono); padding:2px 7px; border-radius:999px;
               background:#1b1f29; color:var(--dim); }
  .agent[data-state="speaking"] .st  { background:var(--accent); color:#06121a; }
  .agent[data-state="listening"] .st { background:#a78bfa; color:#0b0716; }
  .agent[data-state="thinking"] .st  { background:#fbbf24; color:#1a1204; }

  .foot { margin-top:26px; padding-top:16px; border-top:1px solid var(--line);
          color:var(--dim); font-size:12px; }
  code { font-family:var(--mono); color:#b7c0d4; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Agent roster</h1>
  <p class="sub">One orb per agent id. Click an orb to make that agent speak.</p>

  <div class="bar">
    <button id="add" class="primary">Add agent</button>
    <button id="add10">Add 10</button>
    <button id="cycle">Cycle states</button>
    <button id="speak-all">Everyone speaks</button>
    <button id="hush">All idle</button>
    <span class="spacer"></span>
    <button id="rebuild">Rebuild all (prove identity)</button>
    <button id="batch" class="on">Batching: on</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="grid" id="grid"></div>

  <p class="foot">
    Every orb here is mounted at <code>size: 64</code> with <code>lens: false</code>, which is what
    makes it eligible for the instanced batch path. Watch <b>draw calls</b> as you add agents.
  </p>
</div>

<script type="module">
  import {
    createOrb,
    OrbAudioSource,
    identityForSeed,
    diagnostics,
    resetCounters,
    setBatching,
    resumeAudio,
    STATES,
  } from '../src/orb.js';

  const grid  = document.getElementById('grid');
  const stats = document.getElementById('stats');

  // Just ids. This is the entire persisted state of the visual system: no colour
  // column, no avatar url, no theme record. The seed is the look.

  const SEEDS = [
    'agent-atlas', 'agent-bramble', 'agent-cinder', 'agent-dune',
    'agent-ember', 'agent-flint', 'agent-glimmer', 'agent-hollow',
    'agent-ivory', 'agent-juniper', 'agent-kestrel', 'agent-lumen',
  ];

  /** seed -> { orb, card, st, unbind } */
  const roster = new Map();

  // One shared source, started here by us, so it is ours. Orbs that bind an
  // already-active source never stop it on unbind.
  //
  // Built lazily on the first gesture, because an AudioContext created before any
  // interaction starts suspended.

  let shared = null;

  async function sharedSource() {
    if (shared && !shared.stopped) return shared;
    await resumeAudio();
    // synthetic() fabricates a speech-shaped level with no AudioContext work and
    // no sound, which is what a wall of twelve avatars wants. Swap in
    // OrbAudioSource.speech() if you want to hear one.
    shared = OrbAudioSource.synthetic();
    shared.start();          // we start it, so we own it
    return shared;
  }

  function addAgent(seed) {
    if (roster.has(seed)) return;

    // identityForSeed is pure: same string in, same identity out. Read here only
    // to label the card; the orb derives its own copy.
    const id = identityForSeed(seed);

    const card = document.createElement('div');
    card.className = 'agent';
    card.dataset.state = 'idle';

    const slot = document.createElement('div');
    slot.className = 'slot';

    const name = document.createElement('div');
    name.className = 'id';
    name.textContent = seed;

    const meta = document.createElement('div');
    meta.className = 'meta';
    // Every visual property is a function of the hash. Same hash, same orb.
    meta.textContent = id.archetype + ' - ' + id.hash.toString(16);

    const st = document.createElement('span');
    st.className = 'st';
    st.textContent = 'idle';

    card.append(slot, name, meta, st);
    grid.appendChild(card);

    /* The batch-path contract. size 64 is at most 128 device px at the library's
     * dpr cap of 2, and lens:false means no chromatic rim. Both are required:
     * break either and this orb quietly falls back to the per-orb hero path, and
     * the draw-call count starts climbing with the roster. */
    const orb = createOrb(slot, {
      seed,
      size: 64,
      lens: false,
      state: 'idle',
      // Exposed to assistive tech, because here the orb carries information:
      // which agent this is. Elsewhere it is decorative and the library hides it
      // with aria-hidden by default.
      ariaLabel: seed + ' agent orb',
    });

    const entry = { orb, card, st, unbind: null };
    roster.set(seed, entry);

    // Click an agent to give it the shared voice.
    card.addEventListener('click', () => toggleSpeaking(seed));
    return entry;
  }

  function setState(seed, state) {
    const e = roster.get(seed);
    if (!e) return;
    e.orb.setState(state);         // crossfades over ~350ms
    e.card.dataset.state = state;
    e.st.textContent = state;
  }

  async function startSpeaking(seed) {
    const e = roster.get(seed);
    if (!e || e.unbind) return;
    const src = await sharedSource();
    // listen() binds an existing source. It is already active, so this orb does
    // not take ownership, and unbinding leaves the other speakers running.
    e.unbind = e.orb.listen(src);
    setState(seed, 'speaking');
  }

  function stopSpeaking(seed) {
    const e = roster.get(seed);
    if (!e || !e.unbind) return;
    e.unbind();                    // idempotent, and only unbinds this orb
    e.unbind = null;
    e.orb.level = 0;
    setState(seed, 'idle');
  }

  function toggleSpeaking(seed) {
    const e = roster.get(seed);
    if (!e) return;
    if (e.unbind) stopSpeaking(seed); else startSpeaking(seed);
  }

  let counter = 0;

  document.getElementById('add').addEventListener('click', () => {
    addAgent('agent-' + (++counter) + '-' + Math.random().toString(36).slice(2, 7));
  });

  document.getElementById('add10').addEventListener('click', () => {
    for (let i = 0; i < 10; i++) {
      addAgent('agent-' + (++counter) + '-' + Math.random().toString(36).slice(2, 7));
    }
  });

  // Give every agent a different state, so all four are on screen at once.
  document.getElementById('cycle').addEventListener('click', () => {
    let i = 0;
    for (const seed of roster.keys()) {
      stopSpeaking(seed);
      setState(seed, STATES[i++ % STATES.length]);
    }
  });

  document.getElementById('speak-all').addEventListener('click', async () => {
    // one await, then every orb binds the same source object
    await sharedSource();
    for (const seed of roster.keys()) startSpeaking(seed);
  });

  document.getElementById('hush').addEventListener('click', () => {
    for (const seed of roster.keys()) { stopSpeaking(seed); setState(seed, 'idle'); }
  });

  /* The identity proof. Tear every orb down completely (GL resources, DOM, audio
   * bindings) then mount a fresh set from the same ids. Nothing about the
   * appearance was saved anywhere and they come back identical. */
  document.getElementById('rebuild').addEventListener('click', () => {
    const seeds = [...roster.keys()];
    for (const e of roster.values()) e.orb.destroy();
    roster.clear();
    grid.textContent = '';
    for (const seed of seeds) addAgent(seed);
  });

  const batchBtn = document.getElementById('batch');
  let batching = true;
  batchBtn.addEventListener('click', () => {
    batching = !batching;
    setBatching(batching);      // off routes every orb through the hero program
    batchBtn.textContent = 'Batching: ' + (batching ? 'on' : 'off');
    batchBtn.classList.toggle('on', batching);
  });

  // drawCalls accumulates, so sample it once a second and reset. The number shown
  // is calls per second; divide by fps for calls per frame.

  let lastSample = performance.now();
  let callsPerSec = 0;

  function sample() {
    const now = performance.now();
    const d = diagnostics();
    if (now - lastSample >= 1000) {
      callsPerSec = d.drawCalls;
      resetCounters();
      lastSample = now;
    }
    stats.innerHTML =
      'orbs <b>' + d.orbs + '</b>' +
      '&nbsp;&nbsp;batched <b>' + d.batched + '</b>' +
      '&nbsp;&nbsp;draw calls/s <b>' + callsPerSec + '</b>' +
      '&nbsp;&nbsp;fps <b>' + d.fps + '</b>' +
      '&nbsp;&nbsp;sources <b>' + d.sources + '</b>' +
      '&nbsp;&nbsp;instancing <b>' + d.instancing + '</b>' +
      '&nbsp;&nbsp;webgl <b>' + d.webgl + '</b>';
    setTimeout(sample, 250);
  }

  for (const seed of SEEDS) addAgent(seed);
  sample();

  window.addEventListener('pagehide', () => {
    for (const e of roster.values()) e.orb.destroy();
    if (shared) shared.stop();
  });

  window.roster = roster;
</script>
</body>
</html>
